<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>账号中心</title>
<style>
  :root {
    --primary: hsl(195 85% 46%);
    --primary-soft: hsl(195 85% 46% / 0.12);
    --bg: hsl(220 15% 97%);
    --card: #ffffff;
    --fg: hsl(220 20% 14%);
    --muted: hsl(220 10% 48%);
    --border: hsl(220 15% 84%);
    --danger: hsl(5 80% 52%);
    --warn: hsl(38 90% 46%);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: -apple-system, 'Segoe UI', 'PingFang SC', system-ui, sans-serif;
    background: linear-gradient(160deg, hsl(195 85% 96%), hsl(220 20% 97%) 55%, hsl(210 30% 97%));
    color: var(--fg); display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 380px; background: var(--card);
    border: 1px solid var(--border); border-radius: 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.08); padding: 28px;
  }
  .logo {
    width: 48px; height: 48px; margin: 0 auto 14px; border-radius: 14px;
    background: var(--primary-soft); color: var(--primary);
    display: flex; align-items: center; justify-content: center;
  }
  h1 { margin: 0; text-align: center; font-size: 20px; font-weight: 650; letter-spacing: -0.02em; }
  .sub { margin: 6px 0 0; text-align: center; font-size: 12px; color: var(--muted); }
  .tabs { display: flex; gap: 4px; margin: 20px 0 18px; padding: 4px; border-radius: 10px; background: hsl(220 15% 95%); }
  .tab { flex: 1; padding: 8px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: 13px; cursor: pointer; transition: .2s; }
  .tab.active { background: #fff; color: var(--fg); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .field { margin-bottom: 14px; }
  .field label { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
  .input-wrap { position: relative; }
  input[type=text], input[type=password], input[type=email] {
    width: 100%; height: 38px; padding: 0 36px 0 11px; font-size: 13px;
    border: 1px solid var(--border); border-radius: 9px; background: #fff; color: var(--fg);
    outline: none; transition: .18s;
  }
  input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  input:disabled { background: hsl(220 15% 95%); color: hsl(220 10% 62%); cursor: not-allowed; }
  .input-wrap.disabled { cursor: not-allowed; }
  .eye { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 14px; padding: 4px; }
  .hint { margin: 5px 0 0; font-size: 11px; color: var(--muted); }
  .hint.disabled-hint { color: hsl(220 10% 62%); }
  .btn {
    width: 100%; height: 40px; margin-top: 6px; border: 0; border-radius: 10px;
    background: var(--primary); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: .18s;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: translateY(1px); }
  .agree { display: flex; align-items: flex-start; gap: 8px; font-size: 11px; color: var(--muted); margin: 4px 0 10px; line-height: 1.5; }
  .agree input { margin-top: 2px; accent-color: var(--primary); }
  .agree a { color: var(--primary); text-decoration: none; }
  .note { margin-top: 18px; padding: 10px 12px; border-radius: 10px; background: hsl(38 90% 96%); border: 1px solid hsl(38 90% 80%); color: var(--warn); font-size: 11px; line-height: 1.55; }
  .toast { position: fixed; left: 50%; top: 24px; transform: translateX(-50%) translateY(-20px); opacity: 0;
    background: var(--fg); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2); transition: .25s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .hidden { display: none !important; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-size: 10px; font-weight: 600; }
</style>
</head>
<body>
  <div class="toast" id="toast"></div>
  <div class="card">
    <div class="logo">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>
      </svg>
    </div>
    <h1 id="title">登录账号</h1>
    <p class="sub" id="sub">欢迎回来，请输入账号与密码</p>

    <div class="tabs">
      <button class="tab" id="tabLogin" onclick="switchMode('login')">登录</button>
      <button class="tab" id="tabReg" onclick="switchMode('register')">注册</button>
    </div>

    <form id="form" onsubmit="return submitForm(event)">
      <div class="field" id="nicknameField">
        <label>昵称</label>
        <div class="input-wrap"><input type="text" id="nickname" maxlength="20" placeholder="你的显示名称" autocomplete="nickname" /></div>
      </div>

      <div class="field" id="accountField">
        <label>账号 <span class="badge">user_000001</span></label>
        <div class="input-wrap"><input type="text" id="account" maxlength="20" placeholder="按注册顺序生成的账号" autocomplete="username" /></div>
        <p class="hint">账号由系统按注册顺序分配，注册成功后会显示给你</p>
      </div>

      <div class="field" id="emailField">
        <label>邮箱 <span class="badge">暂未启用</span></label>
        <div class="input-wrap disabled" title="邮箱注册暂未启用">
          <input type="email" id="email" disabled placeholder="暂未启用" />
        </div>
        <p class="hint disabled-hint">邮箱注册暂未启用，请使用账号登录</p>
      </div>

      <div class="field" id="passwordField">
        <label>密码</label>
        <div class="input-wrap">
          <input type="password" id="password" maxlength="64" placeholder="6-64 位" autocomplete="current-password" />
          <button class="eye" type="button" onclick="togglePwd()" id="eyeBtn" title="显示密码">👁</button>
        </div>
      </div>

      <div class="field hidden" id="confirmField">
        <label>确认密码</label>
        <div class="input-wrap"><input type="password" id="confirm" maxlength="64" placeholder="再输入一次密码" autocomplete="new-password" /></div>
      </div>

      <label class="agree hidden" id="agreeRow">
        <input type="checkbox" id="agree" /> <span>我已阅读并同意 <a href="#" onclick="return false">用户协议</a> 与 <a href="#" onclick="return false">隐私政策</a></span>
      </label>

      <button class="btn" type="submit" id="submitBtn">登录</button>
    </form>

    <div class="note" id="note">
      本界面运行在隔离沙箱中。账号操作通过受控桥接调用（仅登录/注册接口已授权），其余接口一律拒绝。
    </div>
  </div>

<script>
  var mode = 'login';
  var BRIDGE_KEY = '__pluginBridge';
  var pending = {};       // id -> {resolve, reject}
  var seq = 0;
  var SESSION_KEY = 'agnes-account-session';

  // 接收主应用桥接回传
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d[BRIDGE_KEY] !== 'response' || !d.id) return;
    var p = pending[d.id];
    if (!p) return;
    delete pending[d.id];
    if (d.ok) p.resolve(d.data); else p.reject(new Error(d.error || '请求失败'));
  });

  // 通过父窗口受控桥接调用接口（超时 15s）
  function bridgeCall(path, body) {
    return new Promise(function (resolve, reject) {
      var id = 'req_' + (++seq) + '_' + Date.now();
      pending[id] = { resolve: resolve, reject: reject };
      try {
        parent.postMessage({ __pluginBridge: 'request', id: id, path: path, body: body || {} }, '*');
      } catch (err) { delete pending[id]; reject(err); }
      setTimeout(function () {
        if (pending[id]) { delete pending[id]; reject(new Error('请求超时，请重试')); }
      }, 15000);
    });
  }

  function toast(msg, isError) {
    var t = $('toast'); t.textContent = msg;
    t.style.background = isError ? 'var(--danger)' : 'var(--fg)';
    t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 3200);
  }
  var toastTimer;
  var currentSession = null; // 沙箱无 same-origin，登录态仅存内存（关闭界面即失效）

  function saveSession(user) {
    currentSession = user || null;
    // 沙箱 iframe 无 allow-same-origin，localStorage 不可用；用内存态兜底
    try { if (window.localStorage) localStorage.setItem(SESSION_KEY, JSON.stringify(user)); } catch (e) {}
  }
  function showLoggedIn(user) {
    $('title').textContent = '已登录';
    $('sub').textContent = '账号 ' + user.account + ' · ' + (user.nickname || '用户');
    $('note').textContent = '当前会话已登录（关闭界面后需重新登录）。用户 ID: ' + (user.id || '').slice(0, 8) + '…';
    $('form').style.display = 'none';
  }
  function restoreSession() {
    if (currentSession && currentSession.account) showLoggedIn(currentSession);
  }

  function $(id) { return document.getElementById(id); }
  function switchMode(m) {
    mode = m;
    var reg = m === 'register';
    $('tabLogin').className = 'tab' + (reg ? '' : ' active');
    $('tabReg').className = 'tab' + (reg ? ' active' : '');
    $('title').textContent = reg ? '创建账号' : '登录账号';
    $('sub').textContent = reg ? '填写昵称与密码，账号将按注册顺序分配' : '欢迎回来，请输入账号与密码';
    $('nicknameField').className = reg ? 'field' : 'field hidden';
    $('accountField').className = reg ? 'field hidden' : 'field';
    $('confirmField').className = reg ? 'field' : 'field hidden';
    $('agreeRow').className = reg ? 'agree' : 'agree hidden';
    $('submitBtn').textContent = reg ? '注册' : '登录';
    $('password').setAttribute('autocomplete', reg ? 'new-password' : 'current-password');
  }
  function togglePwd() {
    var p = $('password');
    var show = p.type === 'password';
    p.type = show ? 'text' : 'password';
    $('eyeBtn').textContent = show ? '🙈' : '👁';
    $('eyeBtn').title = show ? '隐藏密码' : '显示密码';
  }
  var toastTimer;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2600);
  }
  function setLoading(on) {
    var b = $('submitBtn');
    b.disabled = on;
    b.textContent = on ? '请稍候…' : (mode === 'register' ? '注册' : '登录');
  }
  function submitForm(e) {
    e.preventDefault();
    if ($('submitBtn').disabled) return false;
    var pwd = $('password').value;
    var path, body;
    if (mode === 'register') {
      var nick = $('nickname').value.trim();
      if (!nick) return toast('请填写昵称', true), false;
      if (pwd.length < 6) return toast('密码至少 6 位', true), false;
      if (pwd.length > 64) return toast('密码最多 64 位', true), false;
      if (pwd !== $('confirm').value) return toast('两次密码不一致', true), false;
      if (!$('agree').checked) return toast('请先同意用户协议与隐私政策', true), false;
      path = '/api/auth/register';
      body = { password: pwd, nickname: nick };
    } else {
      var acc = $('account').value.trim();
      if (!acc) return toast('请填写账号', true), false;
      if (!/^user_0*\d+$/i.test(acc)) return toast('账号格式应为 user_000001', true), false;
      if (!pwd) return toast('请填写密码', true), false;
      path = '/api/auth/login';
      body = { account: acc, password: pwd };
    }
    var isReg = mode === 'register';
    setLoading(true);
    bridgeCall(path, body)
      .then(function (user) {
        saveSession(user);
        if (isReg) {
          toast('注册成功！你的账号：' + (user.account || ''));
          $('account').value = user.account || '';
          setTimeout(function () { switchMode('login'); }, 1800);
        } else {
          toast('登录成功，欢迎回来');
          showLoggedIn(user);
        }
      })
      .catch(function (err) { toast(err.message || '操作失败', true); })
      .finally(function () { setLoading(false); });
    return false;
  }
  switchMode('login');
  restoreSession();
</script>
</body>
</html>
