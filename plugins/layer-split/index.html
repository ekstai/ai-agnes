<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>图片元素编辑器 · Canvas Editor</title>
<style>
:root{--bg:#eef2f8;--card:#fff;--fg:#1b2432;--muted:#6b7890;--line:#dce4ef;--brand:#1f9bd8;--brand2:#0f78ad;--ok:#18a074;--danger:#e05252;--shadow:0 4px 18px rgba(30,60,110,.09)}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,'Segoe UI','PingFang SC',system-ui,sans-serif;background:linear-gradient(150deg,#eef5fc,#f6f9fd 55%,#fdf6ef);color:var(--fg);font-size:12.5px;min-height:100vh}
.app{max-width:1240px;margin:0 auto;padding:16px 18px 50px}
header{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#25b6e8,#0b72b5);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.logo svg{width:21px;height:21px}
h1{font-size:18px;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:11.5px;margin:2px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.toolbar{display:flex;flex-wrap:wrap;gap:7px;padding:11px 13px;align-items:center;margin-bottom:12px}
.btn{border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;background:#fff;color:var(--fg);transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand2);background:#f4fbff}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.pri:hover{background:var(--brand2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 9px;font-size:11px}
.sep{width:1px;height:22px;background:var(--line);margin:0 3px}
.main{display:grid;grid-template-columns:1fr 290px;gap:12px;align-items:start}
@media(max-width:900px){.main{grid-template-columns:1fr}}
.stage-wrap{position:relative;overflow:auto;background:#e7edf5;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-height:420px;display:flex;align-items:center;justify-content:center;padding:24px}
#stage{position:relative;transform-origin:top left;box-shadow:0 8px 30px rgba(20,40,80,.18);background:#fff;flex-shrink:0}
#baseImg{position:absolute;inset:0;width:100%;height:100%;user-select:none;pointer-events:none}
#layer{position:absolute;inset:0;overflow:hidden}
.el{position:absolute;transform-origin:center center;cursor:move;user-select:none}
.el.sel{outline:2px solid var(--brand);outline-offset:0}
.el .txt{width:100%;height:100%;display:flex;align-items:center;justify-content:center;white-space:pre-wrap;word-break:break-word;overflow:hidden;cursor:text}
.el img{width:100%;height:100%;display:block;pointer-events:none}
.el.sel .handles{display:block}
.handles{display:none;position:absolute;inset:-1px;pointer-events:none}
.h{position:absolute;width:10px;height:10px;background:#fff;border:2px solid var(--brand);border-radius:50%;pointer-events:auto;transform:translate(-50%,-50%)}
.h.nw{left:0;top:0;cursor:nwse-resize}.h.n{left:50%;top:0;cursor:ns-resize}.h.ne{left:100%;top:0;cursor:nesw-resize}
.h.e{left:100%;top:50%;cursor:ew-resize}.h.se{left:100%;top:100%;cursor:nwse-resize}.h.s{left:50%;top:100%;cursor:ns-resize}
.h.sw{left:0;top:100%;cursor:nesw-resize}.h.w{left:0;top:50%;cursor:ew-resize}
.rot{position:absolute;left:50%;top:-26px;width:14px;height:14px;background:var(--brand);border:2px solid #fff;border-radius:50%;cursor:grab;pointer-events:auto;transform:translate(-50%,-50%)}
.rotline{position:absolute;left:50%;top:-14px;width:2px;height:14px;background:var(--brand);transform:translateX(-50%)}
.side{padding:14px}
.side h3{margin:0 0 12px;font-size:14px}
.field{margin-bottom:11px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600}
.field input[type=text],.field input[type=number],.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12px;background:#fff;color:var(--fg);font-family:inherit}
.field textarea{resize:vertical;min-height:56px}
.field input[type=range]{width:100%;accent-color:var(--brand)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.colorrow{display:flex;gap:6px;align-items:center}
.colorrow input[type=color]{width:34px;height:30px;border:1px solid var(--line);border-radius:6px;padding:0;background:none;cursor:pointer}
.mini{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 8px;font-size:11px;cursor:pointer;color:var(--fg)}
.mini:hover{border-color:var(--brand);color:var(--brand2)}
.mini.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.layerlist{margin-top:6px;display:flex;flex-direction:column;gap:5px;max-height:230px;overflow:auto}
.li{display:flex;align-items:center;gap:7px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:11.5px}
.li.sel{border-color:var(--brand);background:#f2faff}
.li .ic{font-size:14px}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .z{color:var(--muted);font-size:10px}
.tip{color:var(--muted);font-size:11px;line-height:1.65;margin-top:10px;padding:9px 10px;background:#f7fafe;border-radius:8px;border:1px solid var(--line)}
.empty{padding:26px 12px;text-align:center;color:var(--muted);font-size:12px}
.status{margin-top:10px;font-size:11.5px;color:var(--muted)}
input[type=file]{display:none}
.badge{font-size:10px;color:var(--brand2);background:#eaf6fd;border-radius:5px;padding:2px 6px;margin-left:5px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m3 15 5-5 4 4 3-3 6 6"/><circle cx="8.5" cy="8.5" r="1.5" fill="#fff"/></svg></div>
    <div><h1>图片元素编辑器 <span class="badge">X · Y · Z · 旋转</span></h1><p class="sub">在图片上叠加文本/图片/形状，自由缩放、移动、旋转、改内容 · 本地处理</p></div>
  </header>

  <div class="card toolbar">
    <button class="btn sm" id="btnBase">🖼 载入底图</button>
    <button class="btn sm" id="btnText">＋ 文本</button>
    <button class="btn sm" id="btnImage">＋ 图片</button>
    <button class="btn sm" id="btnRect">＋ 矩形</button>
    <button class="btn sm" id="btnEllipse">＋ 圆形</button>
    <div class="sep"></div>
    <button class="btn sm" id="btnUndo">↶ 撤销</button>
    <button class="btn sm" id="btnRedo">↷ 重做</button>
    <button class="btn sm" id="btnCopy">⧉ 复制</button>
    <button class="btn sm" id="btnDel">🗑 删除</button>
    <div class="sep"></div>
    <button class="btn sm" id="btnSave">💾 存工程</button>
    <button class="btn sm" id="btnLoad">📂 读工程</button>
    <button class="btn sm pri" id="btnExport">⬇ 导出 PNG</button>
    <input type="file" id="fBase" accept="image/*" />
    <input type="file" id="fImage" accept="image/*" />
    <input type="file" id="fProject" accept=".json" />
  </div>

  <div class="main">
    <div class="stage-wrap" id="stageWrap">
      <div id="stage" style="width:800px;height:520px">
        <img id="baseImg" alt="" />
        <div id="layer"></div>
      </div>
    </div>

    <div class="card side">
      <h3>元素属性</h3>
      <div id="noSel" class="empty">选中画布上的元素后可编辑属性<br/><small>点击元素 · 拖动移动 · 拖角缩放 · 拖顶部圆点旋转</small></div>
      <div id="props" style="display:none">
        <div class="field"><label>内容（文本可直接改）</label><textarea id="pText"></textarea></div>
        <div class="row2">
          <div class="field"><label>X 位置</label><input type="number" id="pX" /></div>
          <div class="field"><label>Y 位置</label><input type="number" id="pY" /></div>
        </div>
        <div class="row2">
          <div class="field"><label>宽度 W</label><input type="number" id="pW" /></div>
          <div class="field"><label>高度 H</label><input type="number" id="pH" /></div>
        </div>
        <div class="field"><label>旋转角度（Z 轴） <span id="pRotV"></span>°</label><input type="range" id="pRot" min="-180" max="180" value="0" /></div>
        <div class="row2">
          <div class="field"><label>X 倾斜°</label><input type="number" id="pRX" value="0" /></div>
          <div class="field"><label>Y 倾斜°</label><input type="number" id="pRY" value="0" /></div>
        </div>
        <div class="field"><label>透明度 <span id="pOpaV"></span>%</label><input type="range" id="pOpa" min="0" max="100" value="100" /></div>
        <div class="field"><label>字号</label><input type="number" id="pSize" min="8" max="300" /></div>
        <div class="row2">
          <div class="field"><label>文字颜色</label><div class="colorrow"><input type="color" id="pColor" /><input type="text" id="pColorHex" /></div></div>
          <div class="field"><label>填充颜色</label><div class="colorrow"><input type="color" id="pFill" /><input type="text" id="pFillHex" /></div></div>
        </div>
        <div class="field"><label>对齐</label>
          <button class="mini" data-align="left">左</button><button class="mini" data-align="center">中</button><button class="mini" data-align="right">右</button>
        </div>
        <div class="field"><label>样式</label>
          <button class="mini" id="pBold">B</button><button class="mini" id="pItalic">I</button>
        </div>
        <div class="field"><label>Z 轴层级（叠放顺序）</label>
          <button class="mini sm" id="zTop">置顶</button><button class="mini sm" id="zUp">上移</button><button class="mini sm" id="zDown">下移</button><button class="mini sm" id="zBottom">置底</button>
        </div>
      </div>
      <h3 style="margin-top:18px">图层 <span class="badge" id="layerCount">0</span></h3>
      <div class="layerlist" id="layerList"></div>
      <div class="tip">💡 快捷键：方向键微移 · Shift+方向键大步移动 · Delete 删除 · Ctrl+D 复制 · 双击文本直接编辑内容</div>
      <div class="status" id="status"></div>
    </div>
  </div>
</div>
<script>
/* ===================== 图片元素编辑器引擎（单文件，零依赖） ===================== */
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var stage=$('stage'),layer=$('layer'),wrap=$('stageWrap'),baseImg=$('baseImg');
var S={
  base:null,          // 底图 dataURL
  baseW:800, baseH:520,
  els:[],             // 元素数组，索引即 z 顺序（越大越靠上）
  sel:null,           // 选中元素 id
  zoom:1,
  undo:[], redo:[]
};
var uid=0;
function genId(){return 'el'+(++uid)+'_'+Date.now().toString(36)}
function status(m,type){var s=$('status');s.textContent=m||'';s.style.color=type==='err'?'var(--danger)':type==='ok'?'var(--ok)':'var(--muted)'}
function elById(id){return S.els.find(function(e){return e.id===id})}
function selEl(){return elById(S.sel)}
function snapshot(){return JSON.stringify({base:S.base,baseW:S.baseW,baseH:S.baseH,els:S.els})}
function pushUndo(){S.undo.push(snapshot());if(S.undo.length>60)S.undo.shift();S.redo.length=0}
function restore(s){var d=JSON.parse(s);S.base=d.base;S.baseW=d.baseW;S.baseH=d.baseH;S.els=d.els;if(!elById(S.sel))S.sel=null;renderAll()}

/* ---------- 渲染 ---------- */
function renderAll(){
  // 舞台尺寸
  stage.style.width=S.baseW+'px';stage.style.height=S.baseH+'px';
  if(S.base)baseImg.src=S.base;else baseImg.removeAttribute('src');
  layer.innerHTML='';
  S.els.forEach(function(e,i){layer.appendChild(renderEl(e,i))});
  renderProps();renderLayerList();
  stage.style.transform='scale('+S.zoom+')';
  wrap.scrollLeft=Math.max(0,(wrap.clientWidth-S.baseW*S.zoom)/2);
  wrap.scrollTop=Math.max(0,(wrap.clientHeight-S.baseH*S.zoom)/2);
}
function elBaseStyle(e){
  return 'left:'+e.x+'px;top:'+e.y+'px;width:'+e.w+'px;height:'+e.h+'px;'+
    'opacity:'+(e.opacity==null?1:e.opacity)+';'+
    'transform:rotateZ('+(e.rot||0)+'deg) rotateX('+(e.rx||0)+'deg) rotateY('+(e.ry||0)+'deg);';
}
function renderEl(e,i){
  var d=document.createElement('div');
  d.className='el'+(e.id===S.sel?' sel':'');
  d.dataset.id=e.id;d.style.cssText=elBaseStyle(e);d.style.zIndex=String(i+1);
  var inner='';
  if(e.type==='text'){
    var fs=e.fontSize||32,col=e.color||'#1b2432';
    inner='<div class="txt" style="font-size:'+fs+'px;color:'+col+';font-weight:'+(e.bold?'700':'400')+';font-style:'+(e.italic?'italic':'normal')+';text-align:'+(e.align||'center')+';font-family:'+(e.fontFamily||"'PingFang SC',sans-serif")+'">'+escapeHtml(e.text||'文本')+'</div>';
  } else if(e.type==='image'){
    inner='<img src="'+e.src+'" alt=""/>';
  } else if(e.type==='rect'){
    inner='<div style="width:100%;height:100%;background:'+(e.fill||'rgba(31,155,216,.35)')+';border:'+(e.strokeWidth||0)+'px solid '+(e.stroke||'#1f9bd8')+';border-radius:'+(e.radius||0)+'px"></div>';
  } else if(e.type==='ellipse'){
    inner='<div style="width:100%;height:100%;background:'+(e.fill||'rgba(31,155,216,.35)')+';border:'+(e.strokeWidth||0)+'px solid '+(e.stroke||'#1f9bd8')+';border-radius:50%"></div>';
  }
  d.innerHTML=inner;
  if(e.id===S.sel){
    d.innerHTML+='<div class="handles">'+
      '<div class="rotline"></div><div class="rot" data-h="rot"></div>'+
      ['nw','n','ne','e','se','s','sw','w'].map(function(h){return '<div class="h '+h+'" data-h="'+h+'"></div>'}).join('')+
      '</div>';
  }
  bindEl(d,e);
  return d;
}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

/* ---------- 属性面板 ---------- */
function renderProps(){
  var e=selEl();
  $('noSel').style.display=e?'none':'block';
  $('props').style.display=e?'block':'none';
  $('layerCount').textContent=S.els.length;
  if(!e)return;
  $('pX').value=Math.round(e.x);$('pY').value=Math.round(e.y);
  $('pW').value=Math.round(e.w);$('pH').value=Math.round(e.h);
  $('pRot').value=e.rot||0;$('pRotV').textContent=Math.round(e.rot||0);
  $('pRX').value=e.rx||0;$('pRY').value=e.ry||0;
  $('pOpa').value=Math.round((e.opacity==null?1:e.opacity)*100);$('pOpaV').textContent=Math.round((e.opacity==null?1:e.opacity)*100);
  var isText=e.type==='text',isShape=e.type==='rect'||e.type==='ellipse';
  $('pText').value=e.text||'';$('pText').closest('.field').style.display=isText?'block':'none';
  $('pSize').value=e.fontSize||32;$('pSize').closest('.field').style.display=isText?'block':'none';
  $('pColor').value=e.color||'#1b2432';$('pColorHex').value=e.color||'#1b2432';$('pColor').closest('.field').style.display=isText?'block':'none';
  var fillVal=e.fill||'rgba(31,155,216,.35)';
  // input[type=color] 只接受 #rrggbb；rgba 值只放文本框，color 控件给个近似色
  $('pFill').value=/^#[0-9a-f]{6}$/i.test(fillVal)?fillVal:'#1f9bd8';
  $('pFillHex').value=fillVal;$('pFill').closest('.field').style.display=isShape?'block':'none';
  document.querySelectorAll('[data-align]').forEach(function(b){b.classList.toggle('on',b.dataset.align===(e.align||'center'))});
  $('pBold').classList.toggle('on',!!e.bold);$('pItalic').classList.toggle('on',!!e.italic);
}
function renderLayerList(){
  var L=$('layerList');L.innerHTML='';
  S.els.slice().reverse().forEach(function(e){
    var idx=S.els.indexOf(e);
    var d=document.createElement('div');d.className='li'+(e.id===S.sel?' sel':'');
    var ic={text:'T',image:'🖼',rect:'▭',ellipse:'◯'}[e.type]||'·';
    var nm=e.type==='text'?(e.text||'文本'):e.type==='image'?'图片':e.type==='rect'?'矩形':'圆形';
    d.innerHTML='<span class="ic">'+ic+'</span><span class="nm">'+escapeHtml(nm).slice(0,18)+'</span><span class="z">z'+(idx+1)+'</span>';
    d.onclick=function(){S.sel=e.id;renderAll()};
    L.appendChild(d);
  });
}

/* ---------- 添加元素 ---------- */
function addEl(type,extra){
  pushUndo();
  var base={id:genId(),type:type,x:60,y:60,w:200,h:120,rot:0,rx:0,ry:0,opacity:1};
  var e=Object.assign(base,extra||{});
  if(type==='text'){e.w=240;e.h=70;e.text='双击编辑文字';e.fontSize=32;e.color='#1b2432';e.align='center'}
  if(type==='image'){e.w=260;e.h=180}
  if(type==='rect'||type==='ellipse'){e.w=200;e.h=140;e.fill='rgba(31,155,216,.35)';e.stroke='#1f9bd8';e.strokeWidth=2}
  S.els.push(e);S.sel=e.id;renderAll();status('已添加'+(type==='text'?'文本':type==='image'?'图片':'形状'),'ok');
}

/* ---------- 拖拽：移动 / 8 点缩放 / 旋转 ---------- */
function bindEl(d,e){
  d.addEventListener('pointerdown',function(ev){
    var handle=ev.target.dataset?ev.target.dataset.h:null;
    S.sel=e.id;
    // 选中态需要重建 DOM 以显示手柄；直接更新样式并重建
    renderAll();
    var node=layer.querySelector('[data-id="'+e.id+'"]');
    if(!node)return;
    var start={x:ev.clientX,y:ev.clientY,ex:e.x,ey:e.y,ew:e.w,eh:e.h,erot:e.rot||0};
    var isRotate=handle==='rot';
    var isScale=handle&&handle!=='rot';
    pushUndo();
    var moved=false;
    function onMove(mv){
      var dx=(mv.clientX-start.x)/S.zoom,dy=(mv.clientY-start.y)/S.zoom;
      if(Math.abs(dx)+Math.abs(dy)>1)moved=true;
      if(isRotate){
        var cx=S.baseW/2,cy=S.baseH/2;
        var a0=Math.atan2(start.y-cy,start.x-cx),a1=Math.atan2(mv.clientY-cy,mv.clientX-cx);
        e.rot=Math.round((start.erot+(a1-a0)*180/Math.PI)*10)/10;
      } else if(isScale){
        var w=start.ew,h=start.eh,x=start.ex,y=start.ey;
        if(handle.indexOf('e')>=0)w=Math.max(20,start.ew+dx);
        if(handle.indexOf('w')>=0){w=Math.max(20,start.ew-dx);x=start.ex+(start.ew-w)}
        if(handle.indexOf('s')>=0)h=Math.max(20,start.eh+dy);
        if(handle.indexOf('n')>=0){h=Math.max(20,start.eh-dy);y=start.ey+(start.eh-h)}
        if(ev.shiftKey){var r=start.ew/start.eh;h=w/r}
        e.w=Math.round(w);e.h=Math.round(h);e.x=Math.round(x);e.y=Math.round(y);
      } else {
        e.x=Math.round(start.ex+dx);e.y=Math.round(start.ey+dy);
      }
      node.style.cssText=elBaseStyle(e)+';z-index:'+(S.els.indexOf(e)+1);
      renderProps();
    }
    function onUp(){
      document.removeEventListener('pointermove',onMove);
      document.removeEventListener('pointerup',onUp);
      if(!moved){S.undo.pop()}
      renderAll();
    }
    document.addEventListener('pointermove',onMove);
    document.addEventListener('pointerup',onUp);
    ev.preventDefault();ev.stopPropagation();
  });
  // 双击文本直接编辑
  if(e.type==='text'){
    d.addEventListener('dblclick',function(ev){
      S.sel=e.id;renderAll();
      var node=layer.querySelector('[data-id="'+e.id+'"] .txt');
      if(!node)return;
      node.contentEditable='true';node.focus();
      var sel=window.getSelection(),range=document.createRange();range.selectNodeContents(node);sel.removeAllRanges();sel.addRange(range);
      pushUndo();
      function done(){
        node.contentEditable='false';
        e.text=node.textContent.trim()||'文本';
        renderAll();
      }
      node.addEventListener('blur',done,{once:true});
      node.addEventListener('keydown',function(k){if(k.key==='Enter'&&!k.shiftKey){k.preventDefault();node.blur()}});
    });
  }
}

/* ---------- 属性面板事件 ---------- */
function bindNum(id,key,minv){
  $(id).addEventListener('change',function(){var e=selEl();if(!e)return;pushUndo();var v=Number(this.value);if(!isNaN(v))e[key]=key==='opacity'?v/100:v;renderAll()});
}
['pX','pY','pW','pH'].forEach(function(id){
  var key={pX:'x',pY:'y',pW:'w',pH:'h'}[id];
  $(id).addEventListener('change',function(){var e=selEl();if(!e)return;pushUndo();e[key]=Math.max(key==='w'||key==='h'?1:0,Number(this.value)||0);renderAll()});
});
bindNum('pRX','rx');bindNum('pRY','ry');
$('pText').addEventListener('change',function(){var e=selEl();if(!e||e.type!=='text')return;pushUndo();e.text=this.value||'文本';renderAll()});
$('pRot').addEventListener('input',function(){var e=selEl();if(!e)return;e.rot=Number(this.value);$('pRotV').textContent=this.value;var n=layer.querySelector('[data-id="'+e.id+'"]');if(n)n.style.cssText=elBaseStyle(e)+';z-index:'+(S.els.indexOf(e)+1)});
$('pRot').addEventListener('change',function(){pushUndo();renderAll()});
$('pOpa').addEventListener('input',function(){var e=selEl();if(!e)return;e.opacity=Number(this.value)/100;$('pOpaV').textContent=this.value;var n=layer.querySelector('[data-id="'+e.id+'"]');if(n)n.style.opacity=e.opacity});
$('pOpa').addEventListener('change',function(){pushUndo();renderAll()});
$('pSize').addEventListener('change',function(){var e=selEl();if(!e)return;pushUndo();e.fontSize=Math.max(8,Math.min(300,Number(this.value)||32));renderAll()});
$('pColor').addEventListener('input',function(){var e=selEl();if(!e)return;e.color=this.value;$('pColorHex').value=this.value;var n=layer.querySelector('[data-id="'+e.id+'"] .txt');if(n)n.style.color=this.value});
$('pColorHex').addEventListener('change',function(){var e=selEl();if(!e)return;pushUndo();e.color=this.value;renderAll()});
$('pFill').addEventListener('input',function(){var e=selEl();if(!e)return;e.fill=this.value;$('pFillHex').value=this.value;renderElFill(e,this.value)});
$('pFillHex').addEventListener('change',function(){var e=selEl();if(!e)return;pushUndo();e.fill=this.value;renderAll()});
function renderElFill(e,v){var n=layer.querySelector('[data-id="'+e.id+'"] > div');if(n)n.style.background=v}
document.querySelectorAll('[data-align]').forEach(function(b){b.onclick=function(){var e=selEl();if(!e)return;pushUndo();e.align=b.dataset.align;renderAll()}});
$('pBold').onclick=function(){var e=selEl();if(!e)return;pushUndo();e.bold=!e.bold;renderAll()};
$('pItalic').onclick=function(){var e=selEl();if(!e)return;pushUndo();e.italic=!e.italic;renderAll()};
/* Z 轴层级 */
function zMove(op){var e=selEl();if(!e)return;var i=S.els.indexOf(e),j=i;
  if(op==='top')j=S.els.length-1;else if(op==='bottom')j=0;else if(op==='up')j=Math.min(S.els.length-1,i+1);else j=Math.max(0,i-1);
  if(j===i)return;pushUndo();S.els.splice(i,1);S.els.splice(j,0,e);renderAll();status('Z 层级已调整','ok');
}
$('zTop').onclick=function(){zMove('top')};$('zUp').onclick=function(){zMove('up')};$('zDown').onclick=function(){zMove('down')};$('zBottom').onclick=function(){zMove('bottom')};

/* ---------- 工具栏 ---------- */
$('btnBase').onclick=function(){$('fBase').click()};
$('fBase').onchange=function(){var f=this.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){
  var img=new Image();img.onload=function(){pushUndo();S.base=rd.result;S.baseW=img.naturalWidth;S.baseH=img.naturalHeight;renderAll();status('底图已载入 '+S.baseW+'×'+S.baseH,'ok')};img.src=rd.result;
};rd.readAsDataURL(f)};
$('btnText').onclick=function(){addEl('text')};
$('btnRect').onclick=function(){addEl('rect')};
$('btnEllipse').onclick=function(){addEl('ellipse')};
$('btnImage').onclick=function(){$('fImage').click()};
$('fImage').onchange=function(){var f=this.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){addEl('image',{src:rd.result})};rd.readAsDataURL(f)};
$('btnUndo').onclick=function(){if(!S.undo.length)return;S.redo.push(snapshot());restore(S.undo.pop())};
$('btnRedo').onclick=function(){if(!S.redo.length)return;S.undo.push(snapshot());restore(S.redo.pop())};
$('btnCopy').onclick=function(){var e=selEl();if(!e)return;pushUndo();var c=JSON.parse(JSON.stringify(e));c.id=genId();c.x+=18;c.y+=18;S.els.push(c);S.sel=c.id;renderAll()};
$('btnDel').onclick=function(){var e=selEl();if(!e)return;pushUndo();S.els=S.els.filter(function(x){return x.id!==e.id});S.sel=null;renderAll();status('已删除','ok')};
/* 键盘 */
document.addEventListener('keydown',function(ev){
  var tag=document.activeElement&&document.activeElement.tagName;
  if(tag==='TEXTAREA'||tag==='INPUT'||document.activeElement&&document.activeElement.isContentEditable)return;
  var e=selEl();if(!e)return;
  var step=ev.shiftKey?10:1;
  if(ev.key==='Delete'||ev.key==='Backspace'){ev.preventDefault();$('btnDel').click();return}
  if((ev.ctrlKey||ev.metaKey)&&(ev.key==='d'||ev.key==='D')){ev.preventDefault();$('btnCopy').click();return}
  if((ev.ctrlKey||ev.metaKey)&&ev.key==='z'){ev.preventDefault();$('btnUndo').click();return}
  var dx=0,dy=0;
  if(ev.key==='ArrowLeft')dx=-step;else if(ev.key==='ArrowRight')dx=step;else if(ev.key==='ArrowUp')dy=-step;else if(ev.key==='ArrowDown')dy=step;
  if(dx||dy){ev.preventDefault();pushUndo();e.x+=dx;e.y+=dy;renderAll()}
});
/* 点击空白处取消选中 */
stage.addEventListener('pointerdown',function(ev){if(ev.target===stage||ev.target===layer||ev.target===baseImg){S.sel=null;renderAll()}});

/* ---------- 导出合成 PNG ---------- */
function loadImg(src){return new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i)};i.onerror=rej;i.src=src})}
async function exportPNG(){
  if(!S.base&&!S.els.length){status('画布为空','err');return}
  status('正在合成…');
  try{
    var c=document.createElement('canvas');c.width=S.baseW;c.height=S.baseH;
    var x=c.getContext('2d');
    if(S.base){var bi=await loadImg(S.base);x.drawImage(bi,0,0,S.baseW,S.baseH)}
    for(var i=0;i<S.els.length;i++){
      var e=S.els[i];
      x.save();
      x.globalAlpha=e.opacity==null?1:e.opacity;
      x.translate(e.x+e.w/2,e.y+e.h/2);
      x.rotate((e.rot||0)*Math.PI/180);
      // 2D canvas 无 3D；用轻微斜切近似 rx/ry 倾斜
      if(e.ry)x.transform(1,0,Math.tan((e.ry||0)*Math.PI/180)*-0.3,1,0,0);
      if(e.rx)x.transform(1,Math.tan((e.rx||0)*Math.PI/180)*0.3,0,1,0,0);
      if(e.type==='text'){
        var fs=e.fontSize||32;
        x.font=(e.italic?'italic ':'')+(e.bold?'700 ':'400 ')+fs+'px '+(e.fontFamily||'PingFang SC, sans-serif');
        x.fillStyle=e.color||'#1b2432';
        x.textAlign=e.align||'center';x.textBaseline='middle';
        var lines=String(e.text||'').split('\n'),lh=fs*1.25,y0=-(lines.length-1)*lh/2;
        for(var k=0;k<lines.length;k++)x.fillText(lines[k],0,y0+k*lh,e.w);
      } else if(e.type==='image'){
        var im=await loadImg(e.src);x.drawImage(im,-e.w/2,-e.h/2,e.w,e.h);
      } else if(e.type==='rect'||e.type==='ellipse'){
        x.fillStyle=e.fill||'rgba(31,155,216,.35)';
        x.strokeStyle=e.stroke||'#1f9bd8';x.lineWidth=e.strokeWidth||0;
        x.beginPath();
        if(e.type==='rect'){
          var r=e.radius||0,rw=e.w,rh=e.h,xx=-e.w/2,yy=-e.h/2;
          if(r){x.moveTo(xx+r,yy);x.arcTo(xx+rw,yy,xx+rw,yy+rh,r);x.arcTo(xx+rw,yy+rh,xx,yy+rh,r);x.arcTo(xx,yy+rh,xx,yy,r);x.arcTo(xx,yy,xx+rw,yy,r);x.closePath()}
          else x.rect(xx,yy,rw,rh);
        } else {x.ellipse(0,0,e.w/2,e.h/2,0,0,Math.PI*2)}
        if(e.fill)x.fill();if(e.strokeWidth)x.stroke();
      }
      x.restore();
    }
    c.toBlob(function(bl){
      if(!bl){status('导出失败','err');return}
      var a=document.createElement('a'),u=URL.createObjectURL(bl);a.href=u;a.download='image-editor-export.png';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},3000);
      status('已导出 PNG','ok');
    },'image/png');
  }catch(err){status('导出失败：'+err.message,'err')}
}
$('btnExport').onclick=exportPNG;

/* ---------- 工程保存 / 加载 ---------- */
$('btnSave').onclick=function(){
  var data={v:1,base:S.base,baseW:S.baseW,baseH:S.baseH,els:S.els};
  var blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  var a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download='image-editor-project.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},3000);
  status('工程已保存','ok');
};
$('btnLoad').onclick=function(){$('fProject').click()};
$('fProject').onchange=function(){var f=this.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){
  try{var d=JSON.parse(rd.result);pushUndo();S.base=d.base||null;S.baseW=d.baseW||800;S.baseH=d.baseH||520;S.els=Array.isArray(d.els)?d.els:[];S.sel=null;renderAll();status('工程已载入','ok')}
  catch(e){status('工程文件无效','err')}
};rd.readAsText(f)};

/* ---------- 初始化 ---------- */
function fitStage(){
  var maxW=wrap.clientWidth-48,maxH=Math.max(400,wrap.clientHeight-48);
  S.zoom=Math.min(1,maxW/S.baseW,maxH/S.baseH);
  stage.style.transform='scale('+S.zoom+')';
}
window.addEventListener('resize',fitStage);
/* 默认一张白色底图（纯色 canvas 转 dataURL），保证一进来就能操作 */
(function(){
  var c=document.createElement('canvas');c.width=800;c.height=520;var x=c.getContext('2d');
  x.fillStyle='#ffffff';x.fillRect(0,0,800,520);
  S.base=c.toDataURL('image/png');S.baseW=800;S.baseH=520;
})();
renderAll();
fitStage();
/* 暴露给测试探针 */
window.__editor={S:S,addEl:addEl,renderAll:renderAll,exportPNG:exportPNG,elBaseStyle:elBaseStyle,zMove:zMove};
})();
</script>
